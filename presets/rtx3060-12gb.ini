# Preset orientativo para NVIDIA RTX 3060 12 GB (o GPU similar).
# No copies esto encima de router.preset.ini si Jan ya gestiona tus modelos:
# úsalo como guía de ctx-size / GPU. Aplica los mismos números en
# Ajustes → llama.cpp y en cada modelo.
#
# Idea: todo el modelo en VRAM (n-gpu-layers 99), KV cache q8_0 para
# alargar contexto sin OOM, flash-attn on, un solo modelo cargado.

[*]
fit = on
fit-target = 1024
fit-ctx = 8192
ctx-size = 16384
parallel = 1
cont-batching = false
flash-attn = on
n-gpu-layers = 99
device = CUDA0
cache-type-k = q8_0
cache-type-v = q8_0
ubatch-size = 512

# 4B Q4  → ctx 32768, temp 0.2  (Jan-code: rápido para código)
# 7B Q4  → ctx 16384, temp 0.2  (Qwen2.5-Coder: mejor calidad código)
# 8B Q4  → ctx 16384, temp 0.6  (DeepSeek-R1 destilado: razonar)
# 9B Q4  → ctx 16384            (Qwen3.5 / Gemma)
# 14B Q4 → ctx 8192,  temp 0.3  (Qwen3-14B: máximo en 12 GB)
